name: Publish FX Domain to Firebase
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '2-59/5 * * * *'
permissions:
  contents: read
  id-token: write
concurrency:
  group: firebase-hosting-live
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/hosting.js
      - run: npm install --global firebase-tools@15.19.0
      - uses: google-github-actions/auth@v3
        with:
          service_account: github-hosting@fx-domain.iam.gserviceaccount.com
          project_id: fx-domain
          workload_identity_provider: projects/299301020150/locations/global/workloadIdentityPools/fx-domain-actions/providers/github
      - run: firebase deploy --only hosting --project fx-domain --non-interactive
